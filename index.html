<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12304f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CEU Check-In | CAL ACE</title>
</head>
<body style="margin:0">
<!-- ================================================================
  CAL ACE — CEU Instructor Check-In (mobile)
  WordPress: paste this whole block into a "Custom HTML" block on the
  page calacenursingacademy.com/ceu-checkin. It takes over the full
  screen, so the theme's header/footer won't get in the way.
================================================================= -->
<div id="ceuApp">
<style>
#ceuApp{--navy:#12304f;--navy2:#1b416a;--teal:#0f8b8d;--teal-d:#0b6c6e;--bg:#f2f5f8;--card:#fff;--line:#e2e8ee;
  --text:#17212b;--muted:#64717f;--ok:#1e8e5a;--okbg:#e7f6ee;--warn:#a2650f;--warnbg:#fff5e3;--err:#c0392b;--errbg:#fdeeec;
  position:fixed;inset:0;z-index:2147483000;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#ceuApp *{box-sizing:border-box;margin:0}
#ceuApp button{font:inherit;border:0;cursor:pointer;background:none;color:inherit;text-transform:none;letter-spacing:normal;line-height:1.2}
#ceuApp input{font:inherit;color:var(--text)}
#ceuApp .hide{display:none!important}

/* ---------- Top bar ---------- */
#ceuApp .bar{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;flex-shrink:0}
#ceuApp .bar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#ceuApp .brand{font-weight:700;font-size:18px;letter-spacing:.2px}
#ceuApp .brand small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:1px}
#ceuApp .who{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.95;max-width:55%}
#ceuApp .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ceuApp .iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;flex-shrink:0}
#ceuApp .iconbtn svg{width:20px;height:20px}

/* Date stepper */
#ceuApp .dates{display:flex;align-items:center;gap:8px;margin-top:12px}
#ceuApp .step{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;flex-shrink:0}
#ceuApp .step svg{width:22px;height:22px}
#ceuApp .datebtn{flex:1;height:44px;border-radius:12px;background:#fff;color:var(--navy);font-weight:700;font-size:16px;position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
#ceuApp .datebtn .today{font-size:11px;font-weight:700;background:var(--teal);color:#fff;border-radius:6px;padding:2px 6px}
#ceuApp .datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* Progress */
#ceuApp .prog{margin-top:12px}
#ceuApp .prog-txt{display:flex;justify-content:space-between;font-size:13px;opacity:.9}
#ceuApp .prog-track{height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:6px;overflow:hidden}
#ceuApp .prog-fill{height:100%;width:0;background:#4fd1a5;border-radius:3px;transition:width .35s}

/* ---------- Scroll area ---------- */
#ceuApp .main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(env(safe-area-inset-bottom) + 100px)}
#ceuApp .search{position:relative;margin-bottom:10px}
#ceuApp .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
#ceuApp .search input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px 0 40px;font-size:16px}
#ceuApp .search input:focus,#ceuApp .field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,139,141,.15)}
#ceuApp .sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 4px 8px}
#ceuApp .stu{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
#ceuApp .av{width:40px;height:40px;border-radius:50%;background:#e8eef4;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
#ceuApp .stu.done .av{background:var(--ok);color:#fff}
#ceuApp .info{flex:1;min-width:0}
#ceuApp .nm{font-weight:700;font-size:16px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ceuApp .dt{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#ceuApp .pill{font-size:13px;font-weight:700;color:var(--ok);white-space:nowrap}
#ceuApp .mbtn{height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--teal);color:var(--teal);font-weight:700;font-size:14px;white-space:nowrap;flex-shrink:0}
#ceuApp .mbtn:active{background:var(--teal);color:#fff}
#ceuApp .empty{text-align:center;color:var(--muted);padding:40px 16px}
#ceuApp .empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
#ceuApp .skel{height:66px;border-radius:14px;background:linear-gradient(90deg,#e9eef3 0%,#f5f8fa 50%,#e9eef3 100%);background-size:200% 100%;animation:ceuSh 1.2s infinite;margin-bottom:8px}
@keyframes ceuSh{to{background-position:-200% 0}}

/* ---------- Sticky scan button ---------- */
#ceuApp .dock{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(to top,var(--bg) 70%,rgba(242,245,248,0))}
#ceuApp .scanbtn{width:100%;height:60px;border-radius:16px;background:var(--teal);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 18px rgba(15,139,141,.35)}
#ceuApp .scanbtn:active{background:var(--teal-d);transform:scale(.99)}
#ceuApp .scanbtn svg{width:26px;height:26px}

/* ---------- Login ---------- */
#ceuApp .login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(env(safe-area-inset-bottom) + 24px);max-width:440px;width:100%;margin:0 auto}
#ceuApp .logo{width:64px;height:64px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;margin-bottom:18px}
#ceuApp .logo svg{width:34px;height:34px}
#ceuApp .login h1{font-size:26px;color:var(--navy);line-height:1.15}
#ceuApp .login p.sub{color:var(--muted);margin:6px 0 24px}
#ceuApp .field{margin-bottom:14px}
#ceuApp .field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
#ceuApp .field input{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-size:17px}
#ceuApp .primary{width:100%;height:54px;border-radius:14px;background:var(--teal);color:#fff;font-weight:700;font-size:17px;margin-top:6px}
#ceuApp .primary:disabled{opacity:.6}
#ceuApp .err{background:var(--errbg);color:var(--err);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:12px}

/* ---------- Toast ---------- */
#ceuApp .toast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 88px);background:var(--text);color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;
  transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none;z-index:5}
#ceuApp .toast.show{transform:none;opacity:1}
#ceuApp .toast.ok{background:var(--ok)} #ceuApp .toast.err{background:var(--err)}

/* ---------- Bottom sheet ---------- */
#ceuApp .shade{position:absolute;inset:0;background:rgba(10,20,30,.45);z-index:20;display:flex;align-items:flex-end}
#ceuApp .sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px)}
#ceuApp .sheet h3{font-size:19px;color:var(--navy)}
#ceuApp .sheet p{color:var(--muted);margin:6px 0 18px}
#ceuApp .sheet .row{display:flex;gap:10px}
#ceuApp .sheet .row button{flex:1;height:50px;border-radius:12px;font-weight:700;font-size:16px}
#ceuApp .sheet .cancel{background:#eef2f5;color:var(--text)}
#ceuApp .sheet .ok{background:var(--teal);color:#fff}
#ceuApp .sheet .ok.warn{background:var(--warn)}

/* ---------- Scanner ---------- */
#ceuApp .scan{position:absolute;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#ceuApp .scan-top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;color:#fff;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0))}
#ceuApp .scan-top b{font-size:16px}
#ceuApp .scan-top .cnt{font-size:13px;opacity:.85;display:block;font-weight:400}
#ceuApp .donebtn{height:40px;padding:0 18px;border-radius:20px;background:#fff;color:#000;font-weight:700}
#ceuApp #ceuReader{position:absolute;inset:0}
#ceuApp #ceuReader video{width:100%!important;height:100%!important;object-fit:cover}
#ceuApp #ceuReader > div, #ceuApp #ceuReader img{display:none!important}
#ceuApp .frame{position:absolute;z-index:2;left:50%;top:44%;width:min(68vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
#ceuApp .frame i{position:absolute;width:36px;height:36px;border:4px solid #fff}
#ceuApp .frame i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:22px 0 0 0}
#ceuApp .frame i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0;border-radius:0 22px 0 0}
#ceuApp .frame i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0;border-radius:0 0 0 22px}
#ceuApp .frame i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 22px 0}
#ceuApp .frame.flash-ok{box-shadow:0 0 0 100vmax rgba(30,142,90,.45)}
#ceuApp .frame.flash-err{box-shadow:0 0 0 100vmax rgba(192,57,43,.45)}
#ceuApp .res{position:absolute;z-index:3;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);border-radius:18px;padding:16px;background:rgba(20,26,33,.92);color:#fff;text-align:center;min-height:84px}
#ceuApp .res .big{display:block;font-size:20px;font-weight:700;margin-bottom:2px}
#ceuApp .res.ok{background:var(--ok)} #ceuApp .res.warn{background:var(--warn)} #ceuApp .res.err{background:var(--err)}
#ceuApp .res .row{display:flex;gap:8px;margin-top:12px}
#ceuApp .res .row button{flex:1;height:46px;border-radius:12px;background:#fff;color:#000;font-weight:700}
#ceuApp .res .row button.alt{background:rgba(255,255,255,.2);color:#fff}
</style>

<!-- ===== LOGIN ===== -->
<section class="login" id="vLogin">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
  <h1>CEU Check-In</h1>
  <p class="sub">CAL ACE Nursing Academy · Instructors</p>
  <div class="field"><label for="ceuName">Your name</label><input id="ceuName" autocomplete="name" placeholder="e.g. Rebecca C." autocapitalize="words"></div>
  <div class="field"><label for="ceuPin">Instructor PIN</label><input id="ceuPin" type="password" inputmode="numeric" autocomplete="current-password"></div>
  <button class="primary" id="ceuLoginBtn">Log in</button>
  <div class="err hide" id="ceuLoginErr"></div>
</section>

<!-- ===== APP ===== -->
<section class="hide" id="vApp" style="display:flex;flex-direction:column;flex:1;min-height:0;position:relative">
  <header class="bar">
    <div class="bar-row">
      <div class="brand">CEU Check-In<small>CAL ACE Nursing Academy</small></div>
      <div class="who"><span id="ceuWho"></span>
        <button class="iconbtn" id="ceuLogout" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
      </div>
    </div>
    <div class="dates">
      <button class="step" id="ceuPrev" aria-label="Previous class day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <label class="datebtn"><span id="ceuDateLbl"></span><span class="today hide" id="ceuTodayTag">TODAY</span><input type="date" id="ceuDate" aria-label="Class date"></label>
      <button class="step" id="ceuNext" aria-label="Next class day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="prog">
      <div class="prog-txt"><span id="ceuProgTxt">—</span><span id="ceuProgPct"></span></div>
      <div class="prog-track"><div class="prog-fill" id="ceuProgFill"></div></div>
    </div>
  </header>

  <main class="main" id="ceuMain">
    <div class="search hide" id="ceuSearchWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="ceuSearch" type="search" placeholder="Find a student" autocomplete="off">
    </div>
    <div id="ceuList"></div>
  </main>

  <div class="dock">
    <button class="scanbtn" id="ceuScanBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
      Scan Student QR
    </button>
  </div>

  <div class="toast" id="ceuToast"></div>

  <!-- Bottom sheet (manual check-in / confirmations) -->
  <div class="shade hide" id="ceuSheet">
    <div class="sheet">
      <h3 id="ceuSheetTitle"></h3>
      <p id="ceuSheetText"></p>
      <div class="row"><button class="cancel" id="ceuSheetNo">Cancel</button><button class="ok" id="ceuSheetYes">Check in</button></div>
    </div>
  </div>

  <!-- Scanner -->
  <div class="scan hide" id="ceuScan">
    <div class="scan-top"><div><b>Scan student QR</b><span class="cnt" id="ceuScanCnt"></span></div><button class="donebtn" id="ceuDone">Done</button></div>
    <div id="ceuReader"></div>
    <div class="frame" id="ceuFrame"><i></i><i></i><i></i><i></i></div>
    <div class="res" id="ceuRes"><span class="big">Ready</span>Hold the QR inside the frame</div>
  </div>
</section>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  /* ---- Setting: the CEU web app URL (same as WEB_APP_URL in Settings.gs) ---- */
  var API_URL = "https://script.google.com/macros/s/AKfycbx7RipanvbInhDYUXEeqSn5Wx4h6pRqOhCtiYK4uCwNSbF_t6plX2JJCBBdZCmlb7zx/exec";
  var CLASS_DAYS = [2, 6]; // Tue, Sat

  var $ = function(id){ return document.getElementById(id); };
  var store = {
    get:function(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } },
    set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
    del:function(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };
  var S = { name: store.get("ceu_name"), pin: store.get("ceu_pin"), students: [], filter: "", loading:false };

  // Keep the page from scrolling behind the full-screen app (WordPress themes)
  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";

  /* ---------- Helpers ---------- */
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function todayPT(){ return new Date().toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"}); }
  function parseIso(s){ var p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function toIso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function stepDay(iso,dir){ var d=parseIso(iso); do{ d.setDate(d.getDate()+dir); }while(CLASS_DAYS.indexOf(d.getDay())<0); return toIso(d); }
  function initials(n){ var p=String(n).trim().split(/\s+/); return ((p[0]||"")[0]||"").toUpperCase()+((p.length>1?p[p.length-1]:"")[0]||"").toUpperCase(); }
  function timeOnly(s){ var m=String(s).match(/(\d{1,2}:\d{2}\s*[AP]M)/i); return m?m[1]:s; }

  function api(body){
    body.pin = S.pin;
    return fetch(API_URL,{method:"POST",body:JSON.stringify(body)})      // text/plain → no CORS preflight
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res || typeof res!=="object") return {ok:false,error:"Unexpected reply from the server."};
        if(res.badPin){ logout(); loginErr("Your PIN was not accepted. Please log in again."); }
        return res;
      })
      .catch(function(){ return {ok:false,error:"Can't reach the server. Check the phone's connection."}; });
  }

  var toastT;
  function toast(msg,kind){ var t=$("ceuToast"); t.className="toast show "+(kind||""); t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(function(){ t.className="toast"; },2600); }

  /* ---------- Login ---------- */
  function loginErr(t){ $("ceuLoginErr").textContent=t; $("ceuLoginErr").classList.remove("hide"); }
  function login(){
    var name=$("ceuName").value.trim(), pin=$("ceuPin").value.trim();
    if(!name) return loginErr("Enter your name.");
    if(!pin) return loginErr("Enter the instructor PIN.");
    var b=$("ceuLoginBtn"); b.disabled=true; b.textContent="Checking…";
    S.pin=pin; S.name=name;
    api({action:"login"}).then(function(res){
      b.disabled=false; b.textContent="Log in";
      if(!res.ok) return loginErr(res.error||"Login failed.");
      store.set("ceu_name",name); store.set("ceu_pin",pin);
      showApp();
    });
  }
  function logout(){
    store.del("ceu_pin"); S.pin="";
    $("vApp").classList.add("hide"); $("vLogin").classList.remove("hide"); $("ceuPin").value="";
  }
  function showApp(){
    $("vLogin").classList.add("hide"); $("ceuLoginErr").classList.add("hide"); $("vApp").classList.remove("hide");
    $("ceuWho").textContent=S.name;
    if(!$("ceuDate").value) setDate(todayPT()); else loadRoster();
  }

  /* ---------- Date ---------- */
  function setDate(iso){
    $("ceuDate").value=iso;
    $("ceuDateLbl").textContent=parseIso(iso).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
    $("ceuTodayTag").classList.toggle("hide", iso!==todayPT());
    $("ceuSearch").value=""; S.filter="";
    loadRoster();
  }

  /* ---------- Roster ---------- */
  function loadRoster(){
    S.loading=true;
    $("ceuList").innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    $("ceuProgTxt").textContent="Loading…"; $("ceuProgPct").textContent="";
    var date=$("ceuDate").value;
    api({action:"roster",date:date}).then(function(res){
      if(date!==$("ceuDate").value) return;     // user moved on to another date
      S.loading=false;
      if(!res.ok || !Array.isArray(res.students)){
        S.students=[]; renderProgress();
        $("ceuList").innerHTML='<div class="empty"><b>Couldn\'t load the roster</b>'+esc(res.error||"Please try again.")+'</div>';
        return;
      }
      S.students=res.students; render();
    });
  }
  function renderProgress(){
    var st=S.students, n=st.length, done=st.filter(function(s){return s.attendedAt;}).length;
    $("ceuProgTxt").textContent = n ? (done+" of "+n+" checked in") : "No registrations";
    $("ceuProgPct").textContent = n ? Math.round(done/n*100)+"%" : "";
    $("ceuProgFill").style.width = n ? (done/n*100)+"%" : "0";
    $("ceuScanCnt").textContent = n ? (done+" of "+n+" checked in") : "";
  }
  function row(s){
    return '<div class="stu'+(s.attendedAt?' done':'')+'"><div class="av">'+(s.attendedAt?'✓':esc(initials(s.name)))+'</div>'+
      '<div class="info"><div class="nm">'+esc(s.name)+'</div><div class="dt">'+esc(s.details)+'</div></div>'+
      (s.attendedAt ? '<div class="pill">'+esc(timeOnly(s.attendedAt))+'</div>'
                    : '<button class="mbtn" data-id="'+esc(s.id)+'">Check in</button>')+'</div>';
  }
  function render(){
    renderProgress();
    var st=S.students;
    $("ceuSearchWrap").classList.toggle("hide", st.length<6);
    if(!st.length){
      $("ceuList").innerHTML='<div class="empty"><b>No one registered</b>No registrations from the new form for this date. Use the arrows to change the day.</div>';
      return;
    }
    var f=S.filter.toLowerCase();
    var list=st.filter(function(s){ return !f || s.name.toLowerCase().indexOf(f)>=0; });
    var todo=list.filter(function(s){return !s.attendedAt;}), done=list.filter(function(s){return s.attendedAt;});
    var html="";
    if(todo.length) html+='<div class="sec">Not checked in · '+todo.length+'</div>'+todo.map(row).join("");
    if(done.length) html+='<div class="sec">Checked in · '+done.length+'</div>'+done.map(row).join("");
    if(!list.length) html='<div class="empty"><b>No match</b>No student named “'+esc(S.filter)+'” on this date.</div>';
    $("ceuList").innerHTML=html;
  }
  function markLocal(reg){
    S.students.forEach(function(s){ if(s.id===reg.id){ s.attendedAt=reg.attendedAt; s.checkedBy=reg.checkedBy; } });
    render();
  }

  /* ---------- Bottom sheet ---------- */
  function sheet(title,text,yesLabel,warn){
    return new Promise(function(resolve){
      $("ceuSheetTitle").textContent=title; $("ceuSheetText").textContent=text;
      var y=$("ceuSheetYes"); y.textContent=yesLabel; y.className="ok"+(warn?" warn":"");
      $("ceuSheet").classList.remove("hide");
      function done(v){ $("ceuSheet").classList.add("hide"); y.onclick=$("ceuSheetNo").onclick=$("ceuSheet").onclick=null; resolve(v); }
      y.onclick=function(e){ e.stopPropagation(); done(true); };
      $("ceuSheetNo").onclick=function(e){ e.stopPropagation(); done(false); };
      $("ceuSheet").onclick=function(e){ if(e.target.id==="ceuSheet") done(false); };
    });
  }

  /* ---------- Check-in ---------- */
  function checkIn(id,force){ return api({action:"checkin",id:id,date:$("ceuDate").value,instructor:S.name,force:!!force}); }

  function manual(id,btn){
    var s=S.students.filter(function(x){return x.id===id;})[0]; if(!s) return;
    sheet("Check in "+s.name+"?","Use this if the student doesn't have their QR code.","Check in").then(function(yes){
      if(!yes) return;
      btn.disabled=true; btn.textContent="…";
      checkIn(id,false).then(function(res){
        if(res.ok){ markLocal(res.reg); toast("✓ "+res.reg.name+" checked in","ok"); }
        else { btn.disabled=false; btn.textContent="Check in"; toast(res.error||"Couldn't check in","err"); }
      });
    });
  }

  /* ---------- Scanner ---------- */
  var qr=null, busy=false, lastCode="", lastAt=0;
  function feedback(ok){
    try{ var c=new (window.AudioContext||window.webkitAudioContext)(), o=c.createOscillator(), g=c.createGain();
      o.frequency.value=ok?880:220; o.connect(g); g.connect(c.destination); g.gain.value=.15; o.start(); o.stop(c.currentTime+(ok?.15:.35)); }catch(e){}
    try{ navigator.vibrate && navigator.vibrate(ok?80:[80,60,80]); }catch(e){}
    var f=$("ceuFrame"); f.classList.remove("flash-ok","flash-err"); void f.offsetWidth; f.classList.add(ok?"flash-ok":"flash-err");
    setTimeout(function(){ f.classList.remove("flash-ok","flash-err"); },700);
  }
  function setRes(kind,html){ var r=$("ceuRes"); r.className="res "+(kind||""); r.innerHTML=html; }
  function ready(){ setRes("",'<span class="big">Ready</span>Hold the QR inside the frame'); }

  function openScanner(){
    if(typeof Html5Qrcode==="undefined"){ toast("Scanner didn't load. Refresh the page.","err"); return; }
    $("ceuScan").classList.remove("hide"); renderProgress(); ready(); busy=false;
    qr=new Html5Qrcode("ceuReader",{verbose:false});
    qr.start({facingMode:"environment"},{fps:12,qrbox:function(w,h){var m=Math.floor(Math.min(w,h)*0.68);return {width:m,height:m};}},onScan,function(){})
      .catch(function(){ setRes("err",'<span class="big">Camera blocked</span>Allow camera access for this site in your browser settings, then tap Done and try again.'); });
  }
  function closeScanner(){
    $("ceuScan").classList.add("hide");
    if(qr){ var q=qr; qr=null; q.stop().catch(function(){}).then(function(){ try{q.clear();}catch(e){} }); }
    loadRoster();
  }
  function onScan(text){
    var now=Date.now();
    if(busy || (text===lastCode && now-lastAt<4000)) return;
    busy=true; lastCode=text; lastAt=now;
    setRes("",'<span class="big">Checking…</span>&nbsp;');
    checkIn(text,false).then(handle(text));
  }
  function handle(text){
    return function(res){
      if(res.ok && res.alreadyCheckedIn){
        feedback(true); setRes("warn",'<span class="big">'+esc(res.reg.name)+'</span>Already checked in at '+esc(timeOnly(res.reg.attendedAt))+(res.reg.checkedBy?' by '+esc(res.reg.checkedBy):''));
        return resume(2200);
      }
      if(res.ok){ feedback(true); markLocal(res.reg); renderProgress(); setRes("ok",'<span class="big">✓ '+esc(res.reg.name)+'</span>Checked in'); return resume(1600); }
      if(res.needsConfirm){
        feedback(false);
        setRes("warn",'<span class="big">'+esc(res.reg.name)+'</span>Registered for '+esc(res.reg.classLabel)+' — not this date.'+
          '<div class="row"><button class="alt" id="ceuSkip">Skip</button><button id="ceuForce">Check in anyway</button></div>');
        $("ceuSkip").onclick=function(){ ready(); busy=false; };
        $("ceuForce").onclick=function(){ setRes("",'<span class="big">Checking…</span>&nbsp;'); checkIn(text,true).then(handle(text)); };
        return;
      }
      feedback(false); setRes("err",'<span class="big">Not checked in</span>'+esc(res.error||"Unknown error")); resume(2600);
    };
  }
  function resume(ms){ setTimeout(function(){ busy=false; if(!$("ceuScan").classList.contains("hide")) ready(); }, ms); }

  /* ---------- Wire up ---------- */
  $("ceuLoginBtn").addEventListener("click",login);
  $("ceuPin").addEventListener("keydown",function(e){ if(e.key==="Enter") login(); });
  $("ceuLogout").addEventListener("click",logout);
  $("ceuPrev").addEventListener("click",function(){ setDate(stepDay($("ceuDate").value||todayPT(),-1)); });
  $("ceuNext").addEventListener("click",function(){ setDate(stepDay($("ceuDate").value||todayPT(),1)); });
  $("ceuDate").addEventListener("change",function(){ if(this.value) setDate(this.value); });
  $("ceuSearch").addEventListener("input",function(){ S.filter=this.value.trim(); render(); });
  $("ceuScanBtn").addEventListener("click",openScanner);
  $("ceuDone").addEventListener("click",closeScanner);
  $("ceuList").addEventListener("click",function(e){ var b=e.target.closest(".mbtn"); if(b) manual(b.getAttribute("data-id"),b); });
  document.addEventListener("visibilitychange",function(){ if(!document.hidden && !$("vApp").classList.contains("hide") && $("ceuScan").classList.contains("hide")) loadRoster(); });

  $("ceuName").value=S.name;
  if(S.pin && S.name) showApp();
})();
</script>

</body>
